<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe1ec, #e8ddff);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px 25px;
            border-radius: 25px;
            text-align: center;
            width: 85%;
            max-width: 500px;
            box-shadow: 0 10px 30px #0002;
        }

        h1 {
            color: #8b5cf6;
        }

        p {
            color: #69586f;
            line-height: 1.6;
        }

        button {
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
        }

        #yesBtn {
            background: #8b5cf6;
            color: white;
            position: relative;
        }

        #noBtn {
            background: #ffd1e3;
            color: #6b3152;
        }

        #message {
            margin-top: 25px;
            font-weight: bold;
            color: #8b5cf6;
        }
    </style>
</head>

<body>

    <div class="card">
        <div style="font-size: 50px;">💲</div>

        <h1>Work this weekend?</h1>

        <p>
            i need a job.
        </p>

        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>

        <div id="message"></div>
    </div>

    <script>
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");
        const message = document.getElementById("message");

        function dodgeYes() {
            const padding = 15;

            const maxX =
                window.innerWidth - yesBtn.offsetWidth - padding;

            const maxY =
                window.innerHeight - yesBtn.offsetHeight - padding;

            yesBtn.style.position = "fixed";

            yesBtn.style.left =
                Math.max(padding, Math.random() * maxX) + "px";

            yesBtn.style.top =
                Math.max(padding, Math.random() * maxY) + "px";
        }

        yesBtn.addEventListener("pointerenter", dodgeYes);

        yesBtn.addEventListener("pointerdown", function(event) {
            event.preventDefault();
            dodgeYes();
        });

        noBtn.addEventListener("click", function() {
            message.textContent = "Eish...";
        });
    </script>

</body>
</html>
